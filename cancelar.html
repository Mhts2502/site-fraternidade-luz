<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancelar Agendamento - Fraternidade da Luz</title>
    
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="assets/js/lucide.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: { brand: { blue: '#1e3a8a', gold: '#c4a469' } }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 antialiased">
    
    <div class="bg-white rounded-3xl shadow-xl p-8 max-w-md w-full text-center border-t-8 border-brand-blue">
        
        <div id="estado-loading" class="py-6 block">
            <i data-lucide="loader-2" class="w-10 h-10 animate-spin mx-auto text-brand-blue mb-4"></i>
            <h2 class="text-xl font-bold text-gray-800">Buscando informações...</h2>
            <p class="text-gray-500 text-sm mt-2">Aguarde um momento.</p>
        </div>

        <div id="estado-dados" class="hidden">
            <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4 border border-red-100">
                <i data-lucide="calendar-x" class="w-8 h-8 text-red-600"></i>
            </div>
            
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Cancelar Agendamento</h1>
            
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-6 text-left">
                <p class="text-gray-600 text-sm mb-1">Paciente:</p>
                <p id="nomePaciente" class="font-bold text-brand-blue text-lg mb-3">...</p>
                
                <p class="text-gray-600 text-sm mb-1">Serviço Agendado:</p>
                <p id="servicoPaciente" class="font-bold text-gray-800">...</p>
            </div>

            <p class="text-sm text-gray-500 mb-6 font-medium">Tem certeza que deseja cancelar? Sua vaga será imediatamente devolvida para o sistema.</p>
            
            <button id="btnCancelar" class="w-full bg-red-600 text-white font-bold py-4 rounded-xl hover:bg-red-700 transition shadow-md flex items-center justify-center gap-2">
                <i data-lucide="trash-2" class="w-5 h-5"></i> CONFIRMAR CANCELAMENTO
            </button>
        </div>

        <div id="estado-aviso" class="hidden py-4">
            <div id="iconeAviso" class="mx-auto mb-4 flex justify-center"></div>
            <h2 id="tituloAviso" class="text-2xl font-bold mb-2"></h2>
            <p id="msgAviso" class="text-gray-600 font-medium"></p>
            
            <a href="index.html" class="mt-8 block w-full bg-gray-100 text-gray-700 font-bold py-4 rounded-xl hover:bg-gray-200 transition">
                VOLTAR PARA O SITE
            </a>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            const boxLoading = document.getElementById('estado-loading');
            const boxDados = document.getElementById('estado-dados');
            const boxAviso = document.getElementById('estado-aviso');
            
            const tituloAviso = document.getElementById('tituloAviso');
            const msgAviso = document.getElementById('msgAviso');
            const iconeAviso = document.getElementById('iconeAviso');
            const btnCancelar = document.getElementById('btnCancelar');

            // Proteção contra links sem token
            if (!token) {
                boxLoading.classList.add('hidden');
                boxAviso.classList.remove('hidden');
                tituloAviso.textContent = "Link Inválido";
                tituloAviso.className = "text-2xl font-bold mb-2 text-red-600";
                msgAviso.textContent = "O link de cancelamento que você acessou está quebrado ou não existe.";
                iconeAviso.innerHTML = '<i data-lucide="x-octagon" class="w-16 h-16 text-red-500"></i>';
                lucide.createIcons();
                return;
            }

            try {
                // 1. CARREGA OS DADOS DO AGENDAMENTO ASSIM QUE A PÁGINA ABRE
                const response = await fetch(`/.netlify/functions/cancelar?token=${token}`);
                const data = await response.json();

                boxLoading.classList.add('hidden');

                if (response.ok && data.paciente) {
                    // Tudo certo! Mostra a tela com os dados para ele clicar no botão
                    document.getElementById('nomePaciente').textContent = data.paciente.nome_paciente;
                    document.getElementById('servicoPaciente').textContent = data.paciente.servico_nome;
                    boxDados.classList.remove('hidden');
                } else {
                    // ERRO 404: O Backend avisou que já está cancelado! Trava a tela.
                    boxAviso.classList.remove('hidden');
                    tituloAviso.textContent = "Agendamento Inativo";
                    tituloAviso.className = "text-2xl font-bold mb-2 text-orange-600";
                    msgAviso.textContent = "Este agendamento já foi cancelado anteriormente ou não existe mais no sistema.";
                    iconeAviso.innerHTML = '<i data-lucide="calendar-off" class="w-16 h-16 text-orange-500"></i>';
                    lucide.createIcons();
                }
            } catch (error) {
                boxLoading.classList.add('hidden');
                boxAviso.classList.remove('hidden');
                tituloAviso.textContent = "Erro de Conexão";
                msgAviso.textContent = "Não foi possível conectar ao servidor. Tente novamente mais tarde.";
            }

            // 2. AÇÃO DE CLICAR NO BOTÃO DE CANCELAMENTO
            btnCancelar.addEventListener('click', async () => {
                const textoOriginal = btnCancelar.innerHTML;
                btnCancelar.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> PROCESSANDO...';
                btnCancelar.disabled = true;
                lucide.createIcons();

                try {
                    const postResponse = await fetch('/.netlify/functions/cancelar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token })
                    });
                    
                    const postData = await postResponse.json();

                    if (postResponse.ok && postData.sucesso) {
                        // Backend cancelou e devolveu a vaga! Muda a tela para Sucesso.
                        boxDados.classList.add('hidden');
                        boxAviso.classList.remove('hidden');
                        tituloAviso.textContent = "Cancelado com Sucesso!";
                        tituloAviso.className = "text-2xl font-bold mb-2 text-green-600";
                        msgAviso.textContent = "Sua vaga foi devolvida e estará disponível para outro irmão.";
                        iconeAviso.innerHTML = '<i data-lucide="check-circle-2" class="w-16 h-16 text-green-500"></i>';
                        lucide.createIcons();
                    } else {
                        alert("Erro ao cancelar: " + (postData.erro || "Tente novamente."));
                        btnCancelar.innerHTML = textoOriginal;
                        btnCancelar.disabled = false;
                        lucide.createIcons();
                    }
                } catch(error) {
                    alert("Erro de conexão com o servidor. Verifique sua internet.");
                    btnCancelar.innerHTML = textoOriginal;
                    btnCancelar.disabled = false;
                    lucide.createIcons();
                }
            });
        });
    </script>
</body>
</html>
